v><div id="ranking" class="screen hide"><button class="back" onclick="home()">← 메인</button><h2>🏆 랭킹 보기</h2><div class="infoPanel" id="rankdata"></div><p class="sub">전국 랭킹은 추후 서버 연동 예정입니다.</p></div><div id="settings" class="screen hide"><button class="back" onclick="home()">← 메인</button><h2>⚙️ 설정</h2><div class="infoPanel"><label>효과음 <select id="sound" onchange="localStorage.setItem('sbSound',this.value)"><option value="on">켜기</option><option value="off">끄기</option></select></label><p>언어: 한국어 (영어 준비 중)</p><button class="back" onclick="resetGame()">진행 기록 초기화</button></div></div><div id="play" class="game hide"><div class="gamehead"><button class="back" onclick="home()">⌂ 홈</button><div class="stage" id="stage"></div><div class="pill">⭐ <span id="score">0</span></div></div><div class="progress"><div id="bar"></div></div><div class="arena"><div class="symbol" id="symbol">🧩</div></div><div class="card"><div class="category" id="category">PUZZLE</div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="tools"><button onclick="hint()">💡 힌트</button><button id="next" class="hide" onclick="advance()">다음 스테이지 ➜</button></div></div><div class="leveltitle">🔒 퍼즐 포털</div><div class="levels" id="levels"></div></div></div><script>
const qs=[['규칙의 방','2, 6, 12, 20, 30, ?',['42','40','36','44'],'차이를 비교해 보세요','차이가 4, 6, 8, 10, 12로 늘어납니다.','🔢'],['순위의 방','달리기 경주에서 2등을 추월하면 몇 등일까요?',['2등','1등','3등','4등'],'추월한 사람의 자리를 생각하세요','2등을 추월하면 그 사람의 2등 자리를 차지합니다.','🏃'],['수열의 방','1, 1, 2, 3, 5, 8, ?',['13','11','12','16'],'앞의 두 수를 더해 보세요','피보나치 수열입니다.','🔮'],['공간의 방','정육면체의 면은 몇 개일까요?',['6','8','4','12'],'주사위를 떠올려 보세요','위·아래·앞·뒤·왼쪽·오른쪽, 총 6개입니다.','🎲'],['곱셈의 방','3, 9, 27, 81, ?',['243','162','108','324'],'매번 같은 수를 곱해요','앞 숫자에 3을 곱합니다.','⚡'],['계산의 방','사과 3개가 900원이라면 7개는 얼마일까요?',['2100원','1800원','2700원','3000원'],'사과 한 개의 가격부터 구해 보세요','한 개 300원 × 7개 = 2100원.','🍎'],['문자의 방','A, C, F, J, O, ?',['U','T','V','W'],'알파벳 사이 간격이 커집니다','2, 3, 4, 5, 6칸씩 건너뜁니다.','🔠'],['논리의 방','모든 고양이는 동물이다. 반드시 참인 문장은?',['고양이는 동물이다','모든 동물은 고양이다','고양이는 검다','동물은 검다'],'주어진 사실만 생각하세요','첫 문장만 반드시 참입니다.','🐱'],['시간의 방','5대의 기계가 5분에 5개를 만들면 100대는 100개를 몇 분에 만들까요?',['5분','20분','100분','500분'],'기계도 동시에 늘어납니다','기계 한 대가 5분에 하나씩 만듭니다.','⏱️'],['관찰의 방','삼각형, 사각형, 원 중 꼭짓점이 없는 것은?',['원','삼각형','사각형','모두'],'둥근 모양을 생각하세요','원은 꼭짓점이 없습니다.','🔵']];
let i=Math.min(9,Math.max(0,Number(localStorage.getItem('sbUnlocked')||0))),unlocked=i,score=Number(localStorage.getItem('sbPoints')||0),solved=false,hinted=false;
const $=id=>document.getElementById(id);function hideAll(){['home','map','ranking','settings','play'].forEach(id=>$(id).classList.add('hide'))}function home(){hideAll();$('home').classList.remove('hide');$('topscore').textContent=score;scrollTo(0,0)}function start(){hideAll();$('play').classList.remove('hide');render();scrollTo(0,0)}function showMap(){hideAll();$('map').classList.remove('hide');$('mapgrid').innerHTML='';qs.forEach((q,n)=>{let b=document.createElement('button');b.disabled=n>unlocked;b.innerHTML=n<=unlocked?'✨<br>STAGE '+(n+1):'🔒<br>STAGE '+(n+1);b.onclick=()=>{i=n;start()};$('mapgrid').appendChild(b)});scrollTo(0,0)}function showLevels(){showMap()}function showRanking(){hideAll();$('ranking').classList.remove('hide');$('rankdata').textContent='⭐ 내 누적 점수: '+score+'점 / 최고 해금 스테이지: '+(unlocked+1)+'/10';scrollTo(0,0)}function showSettings(){hideAll();$('settings').classList.remove('hide');$('sound').value=localStorage.getItem('sbSound')||'on';scrollTo(0,0)}function resetGame(){if(!confirm('기록을 초기화할까요?'))return;localStorage.removeItem('sbUnlocked');localStorage.removeItem('sbPoints');score=0;unlocked=0;i=0;home()}
function render(){solved=false;hinted=false;const q=qs[i];$('stage').textContent='STAGE '+(i+1)+'/10';$('score').textContent=score;$('topscore').textContent=score;$('bar').style.width=((i+1)*10)+'%';$('symbol').textContent=q[5];$('category').textContent='✦ '+q[0];$('question').textContent=q[1];$('feedback').textContent='정답을 선택해 주세요';$('next').classList.add('hide');$('answers').innerHTML='';q[2].forEach((a,n)=>{let b=document.createElement('button');b.className='answer';b.textContent=a;b.onclick=()=>answer(n,b);$('answers').appendChild(b)});$('levels').innerHTML='';qs.forEach((_,n)=>{let b=document.createElement('button');b.className='levelbtn'+(n===i?' selected':'');b.textContent=n<=unlocked?'✦ '+(n+1):'🔒';b.disabled=n>unlocked;b.onclick=()=>{i=n;render();window.scrollTo({top:0,behavior:'smooth'})};$('levels').appendChild(b)})}
function answer(n,b){if(solved)return;if(n!==0){b.classList.add('wrong');$('feedback').textContent='❌ 아쉬워요! 다시 생각해 보세요.';setTimeout(()=>b.classList.remove('wrong'),600);return}solved=true;b.classList.add('correct');if(i>=unlocked){score+=hinted?70:100;localStorage.setItem('sbPoints',score)}unlocked=Math.max(unlocked,Math.min(9,i+1));localStorage.setItem('sbUnlocked',unlocked);$('feedback').textContent='✅ 정답! '+qs[i][4];$('score').textContent=score;$('topscore').textContent=score;$('next').classList.remove('hide');$('next').textContent=i===9?'처음부터 다시 플레이':'다음 스테이지 ➜';let fx=document.createElement('div');fx.className='toast';fx.textContent='✨ CLEAR! +'+(hinted?70:100);$('app').appendChild(fx);setTimeout(()=>fx.remove(),900)}
function hint(){if(!solved){hinted=true;$('feedback').textContent='💡 '+qs[i][3]}}function advance(){i=(i+1)%10;render();window.scrollTo({top:0,behavior:'smooth'})}home();
