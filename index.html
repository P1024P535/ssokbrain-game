<!doctype html><html lang='ko'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>SSOK BRAIN</title><style>body{background:radial-gradient(#49308a,#110925);color:white;font:18px system-ui;text-align:center;margin:0;padding:22px}main{max-width:500px;margin:auto}h1{color:#ffda5a}.scene{font-size:100px;padding:45px;background:linear-gradient(135deg,#45319b,#1c144a);border:3px solid #9274db;border-radius:24px;box-shadow:0 15px 30px #090418;transform:perspective(700px) rotateX(6deg)}section{background:#281d56;border-radius:20px;padding:20px;margin-top:20px}button{background:#ffcf58;color:#251243;border:0;border-radius:13px;padding:14px;margin:5px;font-size:17px;font-weight:bold}#answers{display:grid;grid-template-columns:1fr 1fr}#answers button{background:#7251b0;color:white}small{color:#cab9e9}</style><main><h1>🧠 SSOK BRAIN</h1><div class='scene'>🧠💡</div><section><small id='level'></small><h2 id='question'></h2><div id='answers'></div><p id='result'></p><button onclick='hint()'>💡 힌트</button><button id='next' onclick='advance()' hidden>다음 단계 →</button></section><p id='score'></p></main><script>const qs=[['2, 6, 12, 20, 30, ?',['42','40','36','44'],'차이를 살펴보세요','차이가 4,6,8,10,12입니다'],['경주에서 2등을 추월하면 몇 등?',['2등','1등','3등','4등'],'추월한 사람의 자리를 생각하세요','2등 자리를 차지합니다'],['1, 1, 2, 3, 5, 8, ?',['13','11','12','15'],'앞의 두 숫자를 더해보세요','피보나치 수열입니다'],['정육면체의 면은 몇 개?',['6','8','4','12'],'주사위를 생각해보세요','위 아래 앞 뒤 좌 우 6개입니다'],['3, 9, 27, 81, ?',['243','162','108','324'],'곱셈 규칙입니다','매번 3을 곱합니다'],['사과 3개 900원. 7개는?',['2100원','2700원','1800원','3000원'],'한 개 가격부터 구하세요','300원 × 7개입니다'],['A, C, F, J, O, ?',['U','T','V','W'],'알파벳 사이 간격이 커집니다','2,3,4,5,6칸씩 이동합니다'],['모든 고양이는 동물이다. 반드시 참인 것은?',['고양이는 동물이다','동물은 고양이다','고양이는 검다','동물은 검다'],'주어진 문장을 그대로 보세요','첫 번째 문장만 반드시 참입니다'],['5대의 기계가 5분에 5개를 만들면 100대는 100개를 몇 분에?',['5분','20분','100분','500분'],'기계도 함께 늘어납니다','각 기계는 5분에 한 개를 만듭니다'],['삼각형, 사각형, 원 중 꼭짓점이 없는 것은?',['원','삼각형','사각형','모두'],'둥근 모양을 찾으세요','원에는 꼭짓점이 없습니다']];let i=Math.min(9,+(localStorage.sbLevel||0)),score=+(localStorage.sbScore||0),solved=false;function render(){solved=false;let q=qs[i];document.getElementById('level').textContent='STAGE '+(i+1)+'/10';document.getElementById('question').textContent=q[0];document.getElementById('result').textContent='';document.getElementById('next').hidden=true;document.getElementById('score').textContent='점수: '+score;document.getElementById('answers').innerHTML='';q[1].forEach((a,n)=>{let b=document.createElement('button');b.textContent=a;b.onclick=()=>{if(solved)return;if(n){document.getElementById('result').textContent='다시 생각해보세요';return}solved=true;score+=100;localStorage.sbScore=score;localStorage.sbLevel=Math.max(+(localStorage.sbLevel||0),Math.min(9,i+1));document.getElementById('result').textContent='정답! '+q[3];document.getElementById('next').hidden=false;document.getElementById('score').textContent='점수: '+score};document.getElementById('answers').appendChild(b)})}function hint(){if(!solved)document.getElementById('result').textContent='💡 '+qs[i][2]}function advance(){i=(i+1)%10;render()}render()</script></html>
